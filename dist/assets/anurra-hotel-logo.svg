<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anurra">
    <!-- The marigold rosette from the hotel's own gable, in the gold of the
         signboard lettering on its maroon band. -->
    <rect width="32" height="32" fill="#7c2118"/>
    <g fill="#db9a26">
        <circle cx="16" cy="16" r="3"/>
        <g id="petals">
            <ellipse cx="16" cy="8.4" rx="2.1" ry="3.6"/>
            <ellipse cx="16" cy="23.6" rx="2.1" ry="3.6"/>
            <ellipse cx="8.4" cy="16" rx="3.6" ry="2.1"/>
            <ellipse cx="23.6" cy="16" rx="3.6" ry="2.1"/>
        </g>
        <g transform="rotate(45 16 16)">
            <ellipse cx="16" cy="8.4" rx="2.1" ry="3.6"/>
            <ellipse cx="16" cy="23.6" rx="2.1" ry="3.6"/>
            <ellipse cx="8.4" cy="16" rx="3.6" ry="2.1"/>
            <ellipse cx="23.6" cy="16" rx="3.6" ry="2.1"/>
        </g>
    </g>
</svg>
